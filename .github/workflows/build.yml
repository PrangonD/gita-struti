name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q GitaStuti_Android_Project.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: cd proj && gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk Gita-Stuti.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Gita Stuti APK v${{ github.run_number }}
          files: Gita-Stuti.apk
