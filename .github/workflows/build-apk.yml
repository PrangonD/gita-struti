name: Build APK and Release

on:
  push:
    branches: [main]
    paths:
      - 'GitaStuti_Android_Project.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: unzip -q GitaStuti_Android_Project.zip -d project

      - name: Build signed APK
        working-directory: project
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 10))
          gradle assembleRelease --no-daemon -PverCode=$CODE -PverName=1.$CODE
          echo "CODE=$CODE" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk ../GitaStuti.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CODE }}
          name: গীতা ও স্তুতি v${{ env.CODE }}
          body: ${{ github.event.head_commit.message || 'নতুন আপডেট' }}
          files: GitaStuti.apk
          make_latest: true
